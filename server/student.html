<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Làm bài trên lớp · ws-studio</title>
<style>
:root{--bg:#F2F4F6;--paper:#fff;--line:#DCE1E9;--ink:#16202A;--ink-2:#4A5765;--ink-3:#566372;--accent:#2741B0;--accent-soft:#E4E8FA;--ok:#1D6F48;--ok-soft:#E1F3E9;--err:#B42318;--err-soft:#FDE8E6;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px}
header h1{font-size:16px;margin:0;flex:1;line-height:1.3}
.me{font-size:13px;color:var(--ink-3);text-align:right}
.me b{color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--ink-2);margin:12px 0 4px}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border:1px solid #C7CFDB;border-radius:8px;min-height:44px;background:#fff;color:var(--ink)}
input[type=text]:focus,select:focus,button:focus-visible{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.code{text-transform:uppercase;letter-spacing:4px;font-size:22px;font-weight:700}
button{font:inherit;cursor:pointer;border-radius:8px;min-height:44px}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 18px;font-weight:600}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.err{background:var(--err-soft);color:#7c1f15;border-radius:8px;padding:10px 12px;margin-top:12px}
.muted{color:var(--ink-3);font-size:14px}
.ex h2{font-size:17px;margin:0 0 4px}
.ex .ins{color:var(--ink-2);margin:0 0 10px;font-size:15px}
.passage{font-family:var(--serif);background:#FAFBFD;border-left:3px solid var(--line);padding:10px 12px;margin:0 0 12px;white-space:pre-wrap}
.gap{display:inline-block;min-width:28px;text-align:center;font-family:var(--sans);font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.bank span{border:1px dashed #C7CFDB;border-radius:6px;padding:2px 8px;font-size:14px}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.qt{font-family:var(--serif);font-size:17px;margin-bottom:8px}
.qn{font-family:var(--sans);font-weight:700;color:var(--ink-3);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:#fff;border:1px solid #C7CFDB;color:var(--ink);padding:8px 14px;min-width:56px;text-align:left}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
select{font:inherit;width:100%;min-height:44px;border:1px solid #C7CFDB;border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#fff;border:1px solid #C7CFDB;padding:6px 12px;min-height:40px}
.chip.used{visibility:hidden}
.built{min-height:44px;border:1px dashed #C7CFDB;border-radius:8px;padding:8px 12px;font-family:var(--serif);font-size:17px}
.foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line)}
.foot .wrap{display:flex;gap:12px;align-items:center;padding:10px 16px}
.foot .st{flex:1;font-size:14px;color:var(--ink-3)}
.res{text-align:center}
.res .big{font-size:48px;font-weight:800;color:var(--accent);line-height:1.1}
.mark{display:inline-block;width:22px;font-weight:800}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--err)}
.q.ok{background:var(--ok-soft)}.q.bad{background:var(--err-soft)}
.q.ok,.q.bad{border-radius:8px;padding:10px;margin:4px 0}
</style></head>
<body>
<div id="app"></div>
<script>
(function(){
var app = document.getElementById('app');
var LS = 'wsstudio.lop';
var st = { session:null, studentCode:null, name:'', paper:null, answers:{}, submittedAt:null, ended:false, result:null, err:'' };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var LET = 'ABCDEFGH';
function load(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } }
function keep(){ try{ localStorage.setItem(LS, JSON.stringify({session:st.session, studentCode:st.studentCode, name:st.name})); }catch(e){} }
function api(path, body){
  return fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok) throw new Error(d.error||('Lỗi '+r.status)); return d; }); });
}
function apply(d){ st.session=d.session; st.studentCode=d.studentCode; st.name=d.name; st.paper=d.paper; st.answers=d.answers||{}; st.submittedAt=d.submittedAt; st.ended=d.ended; st.result=d.result; keep(); }

/* ---------- vào phiên ---------- */
function joinView(){
  var q = new URLSearchParams(location.search); var saved = load() || {};
  var code = (q.get('ma') || saved.session || '').toUpperCase();
  app.innerHTML = '<div class="wrap" style="max-width:440px;padding-top:40px"><div class="card"><h1 style="margin:0 0 4px;font-size:22px">Làm bài trên lớp</h1>'+
    '<div class="muted">Nhập mã phiên giáo viên đọc hoặc chiếu trên bảng.</div>'+
    '<label for="c">Mã phiên</label><input type="text" id="c" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" value="'+esc(code)+'">'+
    '<div id="new"><label for="n">Tên của em</label><input type="text" id="n" maxlength="40" autocomplete="name" value="'+esc(saved.session===code?'':'')+'">'+
    '<div style="margin-top:16px"><button class="btn" id="go" style="width:100%">Vào làm bài</button></div></div>'+
    '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px"><div class="muted">Đã vào rồi, lỡ thoát ra? Nhập mã cá nhân của em.</div>'+
    '<label for="p">Mã cá nhân</label><input type="text" id="p" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" value="'+esc(saved.session===code&&saved.studentCode||'')+'">'+
    '<div style="margin-top:10px"><button class="btn ghost" id="back" style="width:100%">Vào lại</button></div></div>'+
    (st.err?'<div class="err" role="alert">'+esc(st.err)+'</div>':'')+'</div></div>';
  var c = document.getElementById('c'), n = document.getElementById('n'), p = document.getElementById('p');
  (code ? n : c).focus();
  function join(body){ st.err=''; api('/api/class/join', body).then(function(d){ apply(d); render(); }).catch(function(e){ st.err=e.message; joinView(); }); }
  document.getElementById('go').onclick = function(){ if(!c.value.trim()){ st.err='Hãy nhập mã phiên.'; return joinView(); } if(!n.value.trim()){ st.err='Hãy nhập tên.'; return joinView(); } join({code:c.value, name:n.value}); };
  document.getElementById('back').onclick = function(){ if(!c.value.trim()||!p.value.trim()){ st.err='Nhập cả mã phiên và mã cá nhân.'; return joinView(); } join({code:c.value, studentCode:p.value}); };
  n.onkeydown = function(e){ if(e.key==='Enter') document.getElementById('go').click(); };
  p.onkeydown = function(e){ if(e.key==='Enter') document.getElementById('back').click(); };
}

/* ---------- làm bài ---------- */
function blank(t){ return esc(t).replace(/_{2,}/g,'<b>______</b>'); }
function optBtns(qid, labels, val){ return '<div class="opts">'+labels.map(function(l,i){ return '<button class="opt'+(String(val)===String(i)?' on':'')+'" data-q="'+esc(qid)+'" data-v="'+i+'" aria-pressed="'+(String(val)===String(i))+'">'+l+'</button>'; }).join('')+'</div>'; }
function qHTML(it, q, i){
  var v = st.answers[q.id], n = '<span class="qn">'+(i+1)+'.</span>';
  switch(it.type){
    case 'mcq': return '<div class="qt">'+n+blank(q.stem)+'</div>'+optBtns(q.id, q.options.map(function(o,k){ return '<b>'+LET[k]+'</b> '+esc(o.text); }), v);
    case 'cloze_mcq': return '<div class="qt">'+n+'Chỗ trống <span class="gap">'+q.n+'</span></div>'+optBtns(q.id, q.options.map(function(o,k){ return '<b>'+LET[k]+'</b> '+esc(o); }), v);
    case 'tfng': return '<div class="qt">'+n+esc(q.statement)+'</div>'+optBtns(q.id, ['T · True','F · False','NG · Not given'], v==null?null:['T','F','NG'].indexOf(v));
    case 'fill_blank': return '<div class="qt">'+n+blank(q.text)+'</div><input type="text" data-q="'+esc(q.id)+'" value="'+esc(v||'')+'" placeholder="Từ cần điền" autocomplete="off" autocapitalize="off">';
    case 'word_form': return '<div class="qt">'+n+blank(q.text)+' <b>('+esc(q.baseWord)+')</b></div><input type="text" data-q="'+esc(q.id)+'" value="'+esc(v||'')+'" placeholder="Dạng đúng của từ" autocomplete="off" autocapitalize="off">';
    case 'matching': return '<div class="qt">'+n+'<b>'+esc(q.left)+'</b></div><select data-q="'+esc(q.id)+'"><option value="">Chọn…</option>'+(it.rightList||[]).map(function(r,k){ return '<option value="'+k+'"'+(String(v)===String(k)?' selected':'')+'>'+esc(r)+'</option>'; }).join('')+'</select>';
    case 'ordering':
      var built = v ? String(v).replace(/[.?!]$/,'').split(' ') : []; var used = {}; var cnt = {}; built.forEach(function(w){ cnt[w]=(cnt[w]||0)+1; });
      return '<div class="qt">'+n+'Sắp xếp thành câu đúng</div><div class="built" aria-live="polite">'+(built.length?esc(built.join(' '))+esc(q.punct||'.'):'<span class="muted">Bấm các từ theo thứ tự</span>')+'</div>'+
        '<div class="chips">'+q.words.map(function(w,k){ var u = cnt[w]>0; if(u) cnt[w]--; return '<button class="chip'+(u?' used':'')+'" data-ord="'+esc(q.id)+'" data-w="'+esc(w)+'">'+esc(w)+'</button>'; }).join('')+
        (built.length?' <button class="chip" data-ordclr="'+esc(q.id)+'">↺ Làm lại</button>':'')+'</div>';
    case 'rewrite': return '<div class="qt">'+n+esc(q.original)+'</div><input type="text" data-q="'+esc(q.id)+'" value="'+esc(v||(q.lead?q.lead+' ':''))+'" autocomplete="off" autocapitalize="off">';
    case 'short_answer': return '<div class="qt">'+n+esc(q.question)+'</div><input type="text" data-q="'+esc(q.id)+'" value="'+esc(v||'')+'" placeholder="Tối đa '+(q.maxWords||5)+' từ" autocomplete="off">';
  }
  return '';
}
function passageHTML(it){
  if(!it.passage) return '';
  var p = esc(it.passage).replace(/\{(\d+)\}/g, function(_,k){ return '<span class="gap">'+k+'</span>'; });
  return '<div class="passage">'+p+'</div>';
}
function counts(){ var n=0, a=0; st.paper.items.forEach(function(it){ it.questions.forEach(function(q){ n++; var v=st.answers[q.id]; if(v!==undefined&&v!==null&&String(v).trim()!=='') a++; }); }); return {n:n, a:a}; }
function headerHTML(){
  return '<header><div class="wrap"><h1>'+esc(st.paper.meta.title)+'</h1><div class="me"><b>'+esc(st.name)+'</b><br>Mã cá nhân: <b>'+esc(st.studentCode)+'</b></div></div></header>';
}
function workView(){
  var c = counts();
  app.innerHTML = headerHTML()+'<div class="wrap">'+
    '<div class="muted" style="margin-bottom:10px">Nhớ mã cá nhân <b>'+esc(st.studentCode)+'</b> để vào lại nếu lỡ thoát. Bài làm tự lưu.</div>'+
    st.paper.items.map(function(it){ return '<section class="card ex"><h2>Bài '+it.no+'. '+esc(it.title)+'</h2><p class="ins">'+esc(it.instruction)+'</p>'+passageHTML(it)+
      (it.wordBank&&it.wordBank.length?'<div class="bank">'+it.wordBank.map(function(w){return '<span>'+esc(w)+'</span>';}).join('')+'</div>':'')+
      it.questions.map(function(q,i){ return '<div class="q">'+qHTML(it,q,i)+'</div>'; }).join('')+'</section>'; }).join('')+
    '</div><div class="foot"><div class="wrap"><div class="st" id="stt">Đã làm '+c.a+'/'+c.n+' câu</div><button class="btn" id="sub">Nộp bài</button></div></div>'+
    (st.err?'<div class="wrap"><div class="err" role="alert">'+esc(st.err)+'</div></div>':'');
}
function resultView(){
  var r = st.result || {correct:0,total:0,pct:0,perQ:{}};
  app.innerHTML = headerHTML()+'<div class="wrap"><div class="card res"><div class="muted">'+(st.submittedAt?'Em đã nộp bài':'Phiên đã kết thúc')+'</div>'+
    '<div class="big">'+r.correct+'/'+r.total+'</div><div>câu đúng ('+r.pct+'%)</div></div>'+
    st.paper.items.map(function(it){ return '<section class="card ex"><h2>Bài '+it.no+'. '+esc(it.title)+'</h2>'+it.questions.map(function(q,i){ var ok=r.perQ[q.id];
      var cls = ok===true?'ok':ok===false?'bad':''; return '<div class="q '+cls+'"><span class="mark '+cls+'">'+(ok===true?'✓':ok===false?'✕':'–')+'</span> Câu '+(i+1)+(ok==null?' <span class="muted">(bỏ trống)</span>':'')+'</div>'; }).join('')+'</section>'; }).join('')+
    '<div class="muted" style="text-align:center">Giáo viên sẽ chữa bài trên lớp.</div></div>';
}
function render(){ if(!st.paper) return joinView(); if(st.submittedAt || st.ended) return resultView(); workView(); }

/* ---------- lưu ---------- */
var pending = {}, timer = null;
function status(t){ var e=document.getElementById('stt'); if(e) e.textContent=t; }
function flush(submit){
  clearTimeout(timer); var body = {code:st.session, studentCode:st.studentCode, answers:pending, submit:!!submit}; pending = {};
  return api('/api/class/answer', body).then(function(d){ if(d.submittedAt){ st.submittedAt=d.submittedAt; st.result=d.result; render(); } else { var c=counts(); status('Đã làm '+c.a+'/'+c.n+' câu · đã lưu'); } })
    .catch(function(e){ if(/kết thúc|đã nộp/.test(e.message)){ return api('/api/class/join',{code:st.session, studentCode:st.studentCode}).then(function(d){ apply(d); render(); }); }
      Object.assign(pending, body.answers); status('Chưa lưu được: '+e.message+' · sẽ thử lại'); timer=setTimeout(function(){ flush(false); }, 3000); });
}
function set(qid, v){ st.answers[qid]=v; pending[qid]=v; var c=counts(); status('Đã làm '+c.a+'/'+c.n+' câu · đang lưu…'); clearTimeout(timer); timer=setTimeout(function(){ flush(false); }, 700); }
app.addEventListener('click', function(e){
  var o = e.target.closest('.opt');
  if(o){ var it=findItem(o.dataset.q); var v=o.dataset.v; if(it&&it.type==='tfng') v=['T','F','NG'][+v]; set(o.dataset.q, v); var sc=window.scrollY; workView(); window.scrollTo(0,sc); return; }
  var w = e.target.closest('[data-ord]');
  if(w){ var qid=w.dataset.ord, q=findQ(qid); var cur=st.answers[qid]?String(st.answers[qid]).replace(/[.?!]$/,'').split(' '):[]; cur.push(w.dataset.w);
    set(qid, cur.join(' ')+(cur.length===q.words.length?(q.punct||'.'):'')); var s2=window.scrollY; workView(); window.scrollTo(0,s2); return; }
  var clr = e.target.closest('[data-ordclr]');
  if(clr){ set(clr.dataset.ordclr, ''); var s3=window.scrollY; workView(); window.scrollTo(0,s3); return; }
  if(e.target.id==='sub'){ var c=counts(); if(c.a<c.n && !confirm('Em mới làm '+c.a+'/'+c.n+' câu. Vẫn nộp bài?')) return; if(c.a===c.n && !confirm('Nộp bài? Nộp rồi không sửa được.')) return;
    e.target.disabled=true; flush(true); }
});
app.addEventListener('input', function(e){ if(e.target.matches('input[data-q]')) set(e.target.dataset.q, e.target.value); });
app.addEventListener('change', function(e){ if(e.target.matches('select[data-q]')) set(e.target.dataset.q, e.target.value); });
function findItem(qid){ var r=null; st.paper.items.forEach(function(it){ it.questions.forEach(function(q){ if(q.id===qid) r=it; }); }); return r; }
function findQ(qid){ var r=null; st.paper.items.forEach(function(it){ it.questions.forEach(function(q){ if(q.id===qid) r=q; }); }); return r; }

/* Vào lại tự động nếu máy này đã vào phiên đó */
var saved = load(), qs = new URLSearchParams(location.search);
if(saved && saved.studentCode && (!qs.get('ma') || qs.get('ma').toUpperCase()===saved.session)){
  api('/api/class/join',{code:saved.session, studentCode:saved.studentCode}).then(function(d){ apply(d); render(); }).catch(function(){ joinView(); });
} else joinView();
setInterval(function(){ if(st.paper && !st.submittedAt && !st.ended && !Object.keys(pending).length) api('/api/class/join',{code:st.session, studentCode:st.studentCode}).then(function(d){ if(d.ended){ apply(d); render(); } }).catch(function(){}); }, 8000);
})();
</script>
</body></html>
